[project]
name = "speech-analyser"
version = "0.1.0"
description = "Contrastive speech analytics with temporal flaw grounding (Multimodal AI Hackathon 2026, Track C)"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    # signal processing / features
    "numpy>=1.26,<2.3",
    "scipy>=1.13",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "praat-parselmouth>=0.4.5",
    "pyloudnorm>=0.1.1",
    # transcription + forced alignment (CPU)
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "faster-whisper>=1.1",
    # scoring model + data handling
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "tqdm>=4.66",
    "huggingface-hub>=0.24",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

# Linux PyPI torch wheels bundle CUDA (~2.5 GB); the pipeline is CPU-only, so use the CPU index there.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speech_analyser"]

[tool.ruff]
line-length = 100
